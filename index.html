<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Titolo e Descrizione Ottimizzati per SEO Locale -->
  <title>Shock Bar Firenze | Cafè, Cocktail Bar & Aperitivi a Rifredi</title>
  <meta name="description"
    content="Shock Bar a Firenze (Via Gianfrancesco Pagnini 1/3R). Caffetteria, aperitivi, cocktail bar d'autore e colazioni. Vieni a trovarci!" />
  <meta name="keywords"
    content="Shock Bar, Bar Firenze, Cocktail Bar Rifredi, Aperitivo Firenze, Caffetteria Firenze, Via Pagnini Firenze" />

  <!-- Favicon e Icone -->
  <link rel="icon" href="/img/icona.jpg" />
  <link rel="apple-touch-icon" href="/img/icona.jpg" />

  <!-- Open Graph / Anteprima WhatsApp & Social -->
  <meta property="og:title" content="Shock Bar Firenze | Cafè & Cocktail Bar" />
  <meta property="og:description"
    content="Caffetteria, aperitivi e cocktail bar in Via Gianfrancesco Pagnini 1/3R, Firenze. Scopri gli orari e vieni a trovarci!" />
  <meta property="og:url" content="https://shockbar.it/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="it_IT" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- Dati strutturati Local SEO (Schema.org) per Google Maps e Search -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BarOrPub",
      "name": "Shock Bar",
      "image": "https://shockbar.it/img/icona.jpg",
      "@id": "https://shockbar.it/",
      "url": "https://shockbar.it/",
      "telephone": "+393514929304",
      "email": "shock.pub1@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Via Gianfrancesco Pagnini, 1/3R",
        "addressLocality": "Firenze",
        "postalCode": "50134",
        "addressCountry": "IT"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 43.7905071,
        "longitude": 11.2518246
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Thursday", "Friday"],
          "opens": "06:30",
          "closes": "23:45"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday", "Sunday"],
          "opens": "08:00",
          "closes": "02:00"
        }
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
